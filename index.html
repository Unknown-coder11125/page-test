<div id="rc" style="display:none;position:fixed;top:0;left:0;right:0;z-index:30;background:#d97757;color:#fff;text-align:center;padding:6px;font-size:14px">재접속 중…</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),SU='♠♥♦♣',RK='23456789TJQKA',START=400,
HN=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시'];
/* ▼ 해외 접속용 릴레이(TURN) 설정: Metered 무료 계정의 username/credential을 아래 따옴표 안에 붙여넣으세요 */
const TURN_USER='',TURN_CRED='';
const T=(u)=>({urls:u,username:TURN_USER,credential:TURN_CRED});
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.relay.metered.ca:80'}]
 .concat(TURN_USER?[T('turn:global.relay.metered.ca:80'),T('turn:global.relay.metered.ca:80?transport=tcp'),T('turn:global.relay.metered.ca:443'),T('turns:global.relay.metered.ca:443?transport=tcp')]:[]);
const PO={config:{iceServers:ICE,iceCandidatePoolSize:4}};
const perr=e=>e.type=='peer-unavailable'?'방을 찾을 수 없습니다. 방장이 방을 열어 둔 상태인지, 최신 링크인지 확인하세요.'
 :['network','server-error','socket-error','socket-closed'].includes(e.type)?'연결 서버에 접속하지 못했습니다. 다른 네트워크(데이터/와이파이)나 VPN으로 다시 시도해 보세요.'
 :'연결 실패: '+e.type;
let peer,isHost=false,G,hostConn,link='',rv=0,rk='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=()=>(($('#nm').value||'').trim()||'플레이어').slice(0,10);
const live=p=>!p.out&&!p.fold,canAct=p=>live(p)&&!p.allin;
const mk=(name,conn)=>({name,conn,stack:START,hole:[],bet:0,tot:0,fold:false,allin:false,out:false,acted:false});
function nxt(i,f){const P=G.players;for(let k=1;k<=P.length;k++){const j=(i+k)%P.length;if(f(P[j]))return j}return -1}
function put(p,x){x=Math.min(x,p.stack);p.stack-=x;p.bet+=x;p.tot+=x;if(!p.stack)p.allin=true}
/* ---------- 족보 ---------- */
function sc5(c){
 const rs=c.map(x=>x.r).sort((a,b)=>b-a),fl=c.every(x=>x.s==c[0].s);
 let st=0;
 if(new Set(rs).size==5){if(rs[0]-rs[4]==4)st=rs[0];else if(rs.join()=='12,3,2,1,0')st=3}
 const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
 const g=Object.entries(cnt).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),k=g.map(x=>x[1]);
 if(st&&fl)return[8,st];if(g[0][0]==4)return[7,...k];
 if(g[0][0]==3&&g[1][0]==2)return[6,...k];if(fl)return[5,...rs];
 if(st)return[4,st];if(g[0][0]==3)return[3,...k];
 if(g[0][0]==2&&g[1][0]==2)return[2,...k];if(g[0][0]==2)return[1,...k];
 return[0,...rs]}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
function best(c){let b=null;const n=c.length;
 const rec=(st,ch)=>{
  if(ch.length==5){const x=sc5(ch.map(v=>({r:v%13,s:Math.floor(v/13)})));if(!b||cmp(x,b)>0)b=x;return}
  for(let i=st;i<n;i++)rec(i+1,[...ch,c[i]])};
 rec(0,[]);return b}
/* ---------- 방장 게임 엔진 ---------- */
function startHand(){
 clearTimeout(G.tm);clearTimeout(G.tt);G.hold=null;G.away=false;
 const P=G.players;P.forEach(p=>{if(p.stack<=0)p.out=true});
 const al=P.filter(p=>!p.out);
 if(al.length<2){G.stage='over';G.done=true;G.msg='게임 종료: '+(al[0]?al[0].name:'-')+' 우승!';sync();return}
 G.hand++;G.lv=1+Math.floor((G.hand-1)/10);G.sb=2**(G.lv-1);G.bb=G.sb*2;
 G.msg=(G.hand>1&&G.hand%10==1)?`블라인드 업! ${G.sb}/${G.bb}`:'';
 G.btn=G.btn<0?P.findIndex(p=>!p.out):nxt(G.btn,p=>!p.out);
 const d=[...Array(52).keys()];
 for(let i=51;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 G.deck=d;G.board=[];G.rev=false;G.done=false;
 P.forEach(p=>{p.bet=p.tot=0;p.fold=p.out;p.allin=false;p.acted=false;p.hole=p.out?[]:[d.pop(),d.pop()]});
 const sbI=al.length==2?G.btn:nxt(G.btn,p=>!p.out),bbI=nxt(sbI,p=>!p.out);
 put(P[sbI],G.sb);put(P[bbI],G.bb);
 G.cur=G.bb;G.min=G.bb;G.stage='pre';
 G.log.unshift(`── 핸드 #${G.hand} (${G.sb}/${G.bb}) ──`);
 advance(bbI)}
function advance(from){
 const lv=G.players.filter(live);
 if(lv.length==1){win(lv[0]);return}
 const j=nxt(from,p=>canAct(p)&&(!p.acted||p.bet<G.cur));
 if(j>=0){G.to=j;arm();sync();return}
 street()}
function street(){
 const P=G.players;P.forEach(p=>{p.bet=0;p.acted=false});G.cur=0;G.min=G.bb;
 if(G.stage=='river'){showdown();return}
 const n={pre:'flop',flop:'turn',turn:'river'}[G.stage];G.stage=n;
 for(let i=0;i<(n=='flop'?3:1);i++)G.board.push(G.deck.pop());
 if(P.filter(canAct).length<2){street();return}
 G.to=nxt(G.btn,canAct);arm();sync()}
function win(p){
 const pot=G.players.reduce((s,q)=>s+q.tot,0);p.stack+=pot;
 G.stage='end';G.done=true;G.rev=false;G.msg=`${p.name} +${pot} (상대 전원 폴드)`;G.log.unshift('🏆 '+G.msg);G.last=G.msg;nextSoon();sync()}
function nextSoon(){
 clearTimeout(G.tm);clearTimeout(G.tt);G.dl=0;
 if(G.away){G.hold={since:Date.now(),ok:[]};G.away=false}
 else G.tm=setTimeout(startHand,6000)}
function showdown(){
 const P=G.players;G.stage='show';G.rev=true;G.done=true;
 const sc={};P.forEach((p,i)=>{if(live(p))sc[i]=best([...p.hole,...G.board])});
 const lv=[...new Set(P.filter(live).map(p=>p.tot))].sort((a,b)=>a-b),won={};let prev=0;
 lv.forEach(L=>{
  let pot=0;P.forEach(p=>pot+=Math.max(0,Math.min(p.tot,L)-prev));
  const el=P.map((_,i)=>i).filter(i=>live(P[i])&&P[i].tot>=L);
  let w=[el[0]];
  el.slice(1).forEach(i=>{const c=cmp(sc[i],sc[w[0]]);if(c>0)w=[i];else if(!c)w.push(i)});
  const sh=Math.floor(pot/w.length);
  w.forEach(i=>{P[i].stack+=sh;won[i]=(won[i]||0)+sh});
  P[w[0]].stack+=pot-sh*w.length;won[w[0]]+=pot-sh*w.length;prev=L});
 G.msg=Object.keys(won).map(i=>`${P[i].name} +${won[i]} (${HN[sc[i][0]]})`).join(' / ');
 G.log.unshift('🏆 '+G.msg);G.last=G.msg;nextSoon();sync()}
function act(i,a,amt){
 if(!G||G.done||G.to!==i||i<0)return;
 const p=G.players[i],need=G.cur-p.bet;
 clearTimeout(G.tt);if(!G.auto)p.away=false;
 if(a=='fold'&&need>0){p.fold=true;G.log.unshift(`${p.name}: 폴드`)}
 else if(a=='raise'){
  const mx=p.bet+p.stack;let t=Math.min(Math.floor(+amt||0),mx);
  if(t<=G.cur){put(p,need);G.log.unshift(`${p.name}: ${need?'콜':'체크'}`)}
  else{
   if(t<G.cur+G.min&&t<mx)t=Math.min(G.cur+G.min,mx);
   if(t-G.cur>=G.min)G.min=t-G.cur;
   const was=G.cur;put(p,t-p.bet);G.cur=t;
   G.players.forEach(q=>{if(q!==p&&canAct(q))q.acted=false});
   G.log.unshift(`${p.name}: ${p.allin?'올인':was?'레이즈':'벳'} ${t}`)}}
 else{put(p,need);G.log.unshift(`${p.name}: ${need?'콜 '+Math.min(need,need):'체크'}`)}
 p.acted=true;advance(i)}
function view(i){
 const P=G.players;
 return{me:i,hand:G.hand,sb:G.sb,bb:G.bb,stage:G.stage,board:G.board,to:G.to,btn:G.btn,cur:G.cur,min:G.min,
  done:G.done,msg:G.msg,log:G.log.slice(0,8),hold:G.hold?(()=>{const rq=P.map((q,j)=>j).filter(j=>!P[j].out&&!P[j].bot);return{n:rq.length,c:rq.filter(j=>G.hold.ok.includes(j)).length,age:Date.now()-G.hold.since,me:G.hold.ok.includes(i)}})():null,left:G.dl?Math.max(0,G.dl-Date.now()):0,last:G.last||'',over:G.stage=='over',pot:P.reduce((s,p)=>s+p.tot,0),
  ps:P.map((p,j)=>({n:p.name,st:p.stack,bet:p.bet,fold:p.fold&&!p.out,out:p.out,al:p.allin,dc:!!p.dc,aw:!!p.away,
   h:p.hole.length?(j==i||(G.rev&&!p.fold)?p.hole:[-1,-1]):[],
   hn:G.rev&&!p.fold&&p.hole.length?HN[best([...p.hole,...G.board])[0]]:''}))}}
function sync(){
 G.players.forEach((p,i)=>{
  if(i==0)render(view(0));
  else if(p.conn&&p.conn.open)p.conn.send({t:'v',v:view(i)})});
 if(!G.done&&G.stage!='wait'&&G.stage!='over'){const b=G.players[G.to];if(b&&b.bot){clearTimeout(G.bt);const t=G.to;G.bt=setTimeout(()=>botAct(t),900)}}}
/* ---------- 연결 ---------- */
function hostRoom(){
 const name=nm();isHost=true;
 peer=new Peer('hold'+Math.random().toString(36).slice(2,8),PO);
 peer.on('error',e=>alert(perr(e)));
 peer.on('disconnected',()=>{try{peer.reconnect()}catch(x){}});
 peer.on('open',id=>{
  G={players:[mk(name)],hand:0,btn:-1,board:[],stage:'wait',log:[],chat:[],done:false,msg:''};
  link=location.href.split('#')[0]+'#'+id;sync()});
 peer.on('connection',c=>{
  c.on('data',m=>{
   if(m.t=='join'){
    const ex=m.tok&&G.players.find(p=>p.tok===m.tok&&!p.bot);
    if(ex){const o=ex.conn;ex.conn=c;ex.dc=false;ex.away=false;if(o&&o!==c)try{o.close()}catch(x){}
     if(!G.done&&G.stage!='wait'&&G.players[G.to]===ex)arm();sync();bc();return}
    if(G.stage!='wait'||G.players.length>=6){c.send({t:'full'});return}
    const np=mk(String(m.name).slice(0,10),c);np.tok=m.tok;G.players.push(np);sync();bc()}
   else if(m.t=='chat'){const i=G.players.findIndex(p=>p.conn===c);if(i>0)addChat(i,m.m)}
   else if(m.t=='act')act(G.players.findIndex(p=>p.conn===c),m.a,m.amt);
   else if(m.t=='go')goH(G.players.findIndex(p=>p.conn===c));
   else if(m.t=='leave')leaveP(c)});
  c.on('close',()=>{
   const i=G.players.findIndex(p=>p.conn===c);if(i<0)return;
   if(G.stage=='wait')G.players.splice(i,1);
   else{const p=G.players[i];p.dc=true;if(!G.done&&G.to===i)arm();sync()}
   if(G.stage=='wait')sync()})})}
let sess=null,tries=0,joined=false,off=false,vt=0,lastV=null;
function retry(id){
 if(off||isHost)return;
 if(tries++>=30){$('#rc').style.display='none';$('#app').innerHTML='<h1>연결 끊김</h1><p class="sub">다시 연결하지 못했습니다. 링크를 다시 열어 주세요.</p>';return}
 $('#rc').style.display='block';
 clearTimeout(window.rt);window.rt=setTimeout(()=>joinRoom(id,true),3000)}
function joinRoom(id,auto){
 try{sess=JSON.parse(localStorage.getItem('hq')||'null')}catch(x){sess=null}
 if(!(sess&&sess.room==id))sess={room:id,tok:Math.random().toString(36).slice(2)+Date.now().toString(36),name:''};
 if(!auto||!sess.name)sess.name=nm();
 const name=sess.name;myn=name;
 try{localStorage.setItem('hq',JSON.stringify(sess))}catch(x){}
 if(!auto){tries=0;off=false}
 try{peer&&peer.destroy()}catch(x){}
 peer=new Peer(undefined,PO);
 peer.on('error',e=>{if(joined||auto)retry(id);else alert(perr(e))});
 peer.on('open',()=>{
  const hc=hostConn=peer.connect(id,{reliable:true});
  setTimeout(()=>{if(hc===hostConn&&!hc.open){if(joined||auto)retry(id);else alert('연결이 지연됩니다. 방장이 방을 열어 둔 상태인지 확인하고, 다른 네트워크(데이터/VPN)로도 시도해 보세요.')}},15000);
  hc.on('open',()=>hc.send({t:'join',name,tok:sess.tok}));
  hc.on('data',m=>{
   if(m.t=='v'){joined=true;tries=0;$('#rc').style.display='none';render(m.v)}
   if(m.t=='chat')renderChat(m.c);
   if(m.t=='kick'){off=true;try{localStorage.removeItem('hq')}catch(x){}$('#app').innerHTML='<h1>입장 취소</h1><p class="sub">방장이 대기실에서 내보냈습니다.</p>';$('#chat').classList.remove('open');document.body.classList.remove('g')}
   if(m.t=='full'){off=true;alert('입장할 수 없습니다. 이미 게임 중이거나 6명이 모두 찼습니다.')}});
  hc.on('close',()=>{if(hc===hostConn)retry(id)})})}
function leave(){
 if(!confirm('나가면 이 게임의 칩이 사라집니다. 나갈까요?'))return;
 off=true;try{hostConn.send({t:'leave'})}catch(x){}try{localStorage.removeItem('hq')}catch(x){}
 setTimeout(()=>{try{peer.destroy()}catch(x){}},300);
 $('#app').innerHTML='<h1>나갔습니다</h1><p class="sub">이 방에서 나왔습니다. 다시 들어오려면 링크를 새로 여세요.</p>';
 $('#chat').classList.remove('open');document.body.classList.remove('g')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!isHost&&joined&&!off){tries=0;joinRoom(location.hash.slice(1),true)}});
const send=(a,amt)=>isHost?act(0,a,amt):hostConn.send({t:'act',a,amt});
const setR=x=>{rv=x;$('#rv').value=x};
const copyLk=()=>navigator.clipboard.writeText(link).then(()=>alert('링크를 복사했습니다'));
/* ---------- 화면 ---------- */
const cd=c=>{if(c<0)return'<span class="c back"></span>';
 const s=Math.floor(c/13),r=RK[c%13];
 return`<span class="c ${s==1||s==2?'r':''}">${r=='T'?'10':r}<i>${SU[s]}</i></span>`};
const seat=(p,i,v)=>`<div class="seat ${i==v.me?'me ':''}${i==v.to&&!v.done?'to ':''}${p.fold||p.out?'f':''}">
<div class="n"><span>${esc(p.n)}${i==v.btn?'<span class="tag">D</span>':''}</span><span class="st">${p.st}</span></div>
<div class="bt">${p.out?'탈락':(p.dc?'연결 끊김 ':p.aw?'자리비움 ':'')+(p.fold?'폴드':p.al?'올인 ':'')}${p.bet?'베팅 '+p.bet:''}</div>
<div class="cs">${p.h.map(cd).join('')}</div><div class="st">${p.hn}</div></div>`;
function render(v){
 lastV=v;vt=Date.now();
 document.body.classList.add('g');
 const A=$('#app');
 if(v.stage=='wait'){
  A.innerHTML=`<h1>페이지 만들기 테스트</h1><p class="sub">대기실 · ${v.ps.length}/6명 (2명부터 시작 가능)</p>
  ${v.ps.map((p,i)=>`<div class="seat" style="min-height:0;margin:6px 0;display:flex;justify-content:space-between;align-items:center">${esc(p.n)}${isHost&&i?`<button onclick="kick(${i})">강퇴</button>`:''}</div>`).join('')}
  ${isHost?`<p class="sub" style="margin-top:14px">이 링크를 친구에게 보내세요</p>
  <input id="lk" readonly value="${esc(link)}" onclick="this.select()">
  <div class="row"><button onclick="copyLk()">링크 복사</button><button onclick="addBot()" ${v.ps.length>=6?'disabled':''}>컴퓨터 추가</button>
  <button class="p" onclick="startHand()" ${v.ps.length<2?'disabled':''}>게임 시작</button></div>`
  :'<p class="sub">방장이 게임을 시작하길 기다리는 중입니다.</p><button onclick="leave()">나가기</button>'}`;return}
 const me=v.ps[v.me],mine=v.to==v.me&&!v.done,need=Math.max(0,v.cur-me.bet),mx=me.bet+me.st;
 const key=v.hand+v.stage+v.to+v.cur;
 if(key!=rk){rk=key;rv=Math.min(v.cur+Math.max(v.min,v.bb),mx)}
 const pr=f=>Math.min(mx,Math.round(v.cur+(v.pot+need)*f));
 let ctl='';
 if(mine)ctl=`<div class="row"><button class="d" onclick="send('fold')" ${need?'':'disabled'}>폴드</button>
 <button class="p" onclick="send('raise',0)">${need?'콜 '+Math.min(need,me.st):'체크'}</button></div>
 ${me.st>need?`<div class="row"><input id="rv" type="number" value="${rv}" oninput="rv=+this.value">
 <button onclick="send('raise',rv)">${v.cur?'레이즈':'벳'}</button></div>
 <div class="row"><button onclick="setR(${pr(.5)})">½팟</button><button onclick="setR(${pr(.75)})">¾팟</button>
 <button onclick="setR(${pr(1)})">팟</button><button onclick="setR(${mx})">올인</button></div>`:''}`;
 else if(v.done&&!v.over)ctl=v.hold?`<p class="sub">자리비움이 있어 다음 핸드를 보류했습니다. 모두 '진행'을 누르면 시작됩니다.</p><div class="msg" id="hd"></div><div class="row"><button class="p" onclick="goBtn()" ${v.hold.me?'disabled':''}>진행</button>${isHost?'<button onclick="force()">강제 진행</button>':''}</div>`:'<p class="sub">6초 뒤 다음 핸드가 자동으로 시작됩니다.</p>';
 else if(!v.done)ctl=`<p class="sub">${esc(v.ps[v.to].n)} 차례입니다.</p>`;
 A.innerHTML=`<div class="bar"><span>핸드 #${v.hand}</span><span>블라인드 ${v.sb}/${v.bb}</span></div>${isHost?'':'<div style="text-align:right"><button style="padding:4px 10px;font-size:13px" onclick="leave()">나가기</button></div>'}
 <div class="table"><div class="pot">팟 ${v.pot}</div><div class="board">${v.board.map(cd).join('')}</div></div>
 ${v.msg?`<div class="msg">${esc(v.msg)}</div>`:''}${!v.msg&&v.last?`<div class="st">지난 핸드: ${esc(v.last)}</div>`:''}
 <div id="tm" class="tm"></div><div class="seats">${v.ps.map((p,i)=>seat(p,i,v)).join('')}</div>
 <div style="margin-top:12px">${ctl}</div>
 <div class="log">${v.log.map(esc).join('<br>')}</div>`;tick()}
/* ---------- 시작 ---------- */
const id=location.hash.slice(1);
$('#app').innerHTML=`<h1>페이지 만들기 테스트</h1><p class="sub">${id?'친구가 만든 방에 입장합니다.':'방을 만들고 링크를 친구에게 보내세요.'}</p>
<input id="nm" placeholder="닉네임" maxlength="10" autocomplete="off">
<div class="row"><button class="p" onclick="${id?`joinRoom('${esc(id)}')`:'hostRoom()'}">${id?'입장':'방 만들기'}</button></div>`;
let myn='',lastC=0,seen=0;
function addChat(i,m){m=String(m||'').trim().slice(0,200);if(!m)return;G.chat.push({n:G.players[i].name,m});G.chat=G.chat.slice(-50);bc()}
function bc(){G.players.forEach((p,i)=>{if(i&&p.conn&&p.conn.open)p.conn.send({t:'chat',c:G.chat})});renderChat(G.chat)}
function renderChat(c){
 const ml=$('#ml'),me=isHost?G.players[0].name:myn;lastC=c.length;
 ml.innerHTML=c.map(x=>`<div class="m${x.n===me?' mine':''}"><b>${esc(x.n)}</b>${esc(x.m)}</div>`).join('');
 ml.scrollTop=ml.scrollHeight;
 if($('#chat').classList.contains('open')||innerWidth>=900)seen=c.length;
 $('#cb').textContent=c.length>seen?`채팅 (${c.length-seen})`:'채팅'}
function tg(){const e=$('#chat');e.classList.toggle('open');if(e.classList.contains('open')){seen=lastC;$('#cb').textContent='채팅'}}
function sc(){const i=$('#ci'),m=i.value.trim();if(!m)return;i.value='';isHost?addChat(0,m):hostConn.send({t:'chat',m})}
function kick(i){if(G.stage!='wait')return;const p=G.players.splice(i,1)[0];if(p.conn){p.conn.send({t:'kick'});setTimeout(()=>p.conn.close(),300)}sync();bc()}
const BN=['한도윤','민서','태현','지후','수아'];
/* 스타일: 한도윤=타이트 공격형, 민서=루즈 공격형, 태현=콜링스테이션, 지후=매니악, 수아=락(아주 타이트) */
const ST=[{vp:.02,ag:.7,bl:.12,st:0},{vp:.14,ag:.85,bl:.3,st:.05},{vp:.2,ag:.2,bl:.03,st:.22},{vp:.24,ag:.95,bl:.45,st:.1},{vp:-.1,ag:.6,bl:.02,st:-.04}];
function addBot(){if(!G||G.stage!='wait'||G.players.length>=6)return;const k=G.players.filter(p=>p.bot).length%5;G.players.push(Object.assign(mk(BN[k]),{bot:true,sty:k}));sync()}
const ps=h=>{const a=h[0]%13,b=h[1]%13,hi=Math.max(a,b),lo=Math.min(a,b);
 return(hi+lo)/24*.7+(a==b?.45+hi/30:0)+(Math.floor(h[0]/13)==Math.floor(h[1]/13)?.06:0)+(hi-lo<=2&&a!=b?.04:0)};
function pstr(h,B){
 const all=[...h,...B],R=all.map(x=>x%13),hr=h.map(x=>x%13),br=B.map(x=>x%13),mb=Math.max(...br),c=best(all)[0];
 const cn={};br.forEach(x=>cn[x]=(cn[x]||0)+1);
 const bm=Object.values(cn).sort((x,y)=>y-x),bc=bm[0]==4?7:bm[0]==3?(bm[1]==2?6:3):bm[0]==2?(bm[1]==2?2:1):0;
 let s=[.2,.45,.62,.74,.82,.86,.93,.98,1][c];
 if(c<=bc&&c<4)s=[.12,.2,.4,.55][c]+Math.max(...hr)/12*.14;
 else if(c==1){const m=hr.find(x=>br.includes(x));
  if(hr[0]==hr[1])s=hr[0]>mb?.62:.4;else s=m!==undefined&&m==mb?.56+m/12*.08:.42}
 if(B.length<5&&c<4){
  const su=[0,0,0,0];all.forEach(x=>su[Math.floor(x/13)]++);
  const fd=h.some(x=>su[Math.floor(x/13)]>=4),ds=new Set(R);let sd=0;
  for(let k=-1;k<=8;k++){let n=0;for(let j=0;j<5;j++){const x=k+j;if(ds.has(x<0?12:x))n++}if(n>=4)sd=1}
  s+=(fd?.12:0)+(sd?.08:0)}
 return s}
function botAct(i){
 if(!G||G.done||G.to!==i)return;
 try{
  const p=G.players[i],S=ST[p.sty||0],need=G.cur-p.bet,pot=G.players.reduce((q,x)=>q+x.tot,0),bb=G.bb,pre=!G.board.length;
  const e=(pre?ps(p.hole):pstr(p.hole,G.board))+S.vp+(Math.random()-.5)*.24,r=need/(pot+need||1);
  const to=()=>pre?Math.round(G.cur<=bb?bb*(2.2+Math.random()*1.3):G.cur*(2.6+Math.random()*.8)):G.cur+Math.max(G.min,Math.round((pot+need)*(.33+Math.random()*.5)*(S.ag>.9?1.4:1)));
  const open=pre&&G.cur<=bb;
  if(!need)act(i,((e>.62&&Math.random()<S.ag)||(e>.4&&Math.random()<S.ag*.35)||Math.random()<S.bl*(e<.45?1:.4))?'raise':'call',to());
  else{
   const big=need>pot*.75+bb*4,thr=.28+r*.9+(big?.1:0)-S.st;
   if((open&&e>.62&&Math.random()<S.ag)||(e>.85&&Math.random()<S.ag&&!(big&&e<1)))act(i,'raise',to());
   else if(e<.45&&!big&&Math.random()<S.bl*.4)act(i,'raise',to());
   else if(e>thr)act(i,'call');
   else act(i,'fold')}
 }catch(x){if(G&&!G.done&&G.to===i)act(i,G.cur>G.players[i].bet?'fold':'call')}}
const TL=30000,AW=5000,DC=3000;
function arm(){
 clearTimeout(G.tt);G.dl=0;
 if(G.done||G.stage=='wait'||G.stage=='over')return;
 const p=G.players[G.to];if(!p||p.bot)return;
 const ms=p.dc?DC:p.away?AW:TL,t=G.to;G.dl=Date.now()+ms;G.tt=setTimeout(()=>timeout(t),ms)}
function timeout(i){
 if(!G||G.done||G.to!==i)return;
 const p=G.players[i];p.away=true;G.away=true;
 G.log.unshift(`${p.name}: 시간 초과(자리비움)`);
 G.auto=true;act(i,G.cur>p.bet?'fold':'call');G.auto=false}
function chk(){
 if(!G.hold)return;
 const rq=G.players.map((p,i)=>i).filter(i=>!G.players[i].out&&!G.players[i].bot);
 if(rq.every(i=>G.hold.ok.includes(i)))startHand()}
function goH(i){
 if(!G||!G.hold||i<0)return;
 G.players[i].away=false;if(!G.hold.ok.includes(i))G.hold.ok.push(i);
 chk();if(G.hold)sync()}
function leaveP(c){
 const i=G.players.findIndex(p=>p.conn===c);if(i<0)return;
 if(G.stage=='wait'){G.players.splice(i,1);sync();bc();return}
 const p=G.players[i];p.out=true;p.fold=true;p.conn=null;G.log.unshift(`${p.name}: 나감`);
 if(!G.done){const lv=G.players.filter(live);if(lv.length==1)win(lv[0]);else if(G.to==i)advance(i);else sync()}
 else{chk();if(!G.hold||G.hold)sync()}}
const goBtn=()=>isHost?goH(0):hostConn.send({t:'go'});
const force=()=>{if(isHost&&G.hold)startHand()};
function tick(){
 const v=lastV,el=$('#tm');if(!v||!el)return;
 const d=Date.now()-vt;
 if(v.left>0&&!v.done){
  const r=v.left-d,pl=v.ps[v.to];
  if(r>0&&r<=10000){el.className='tm on';el.innerHTML=`<div class="tb" style="width:${r/100}%"></div><span>${esc(pl.n)} · ${Math.ceil(r/1000)}초 뒤 자동 ${v.cur>pl.bet?'폴드':'체크'}</span>`}
  else el.className='tm'}
 else el.className='tm';
 const h=$('#hd');
 if(h&&v.hold){const m=Math.floor((v.hold.age+d)/60000);h.textContent=`진행 ${v.hold.c}/${v.hold.n} · ${m>0?m+'분째 대기중':'대기중'}`}}
setInterval(tick,250);
try{const sv=JSON.parse(localStorage.getItem('hq')||'null');if(id&&sv&&sv.room==id&&sv.name){tries=0;$('#nm').value=sv.name;joinRoom(id,true)}}catch(x){}
</script></body></html>
